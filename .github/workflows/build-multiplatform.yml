name: Build multiplatform packages

on:
  push:
    branches: [master, vllogic-dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v7
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake autoconf-archive libtool pkg-config \
            cmake doxygen qtbase5-dev qttools5-dev qtbase5-dev-tools libqt5svg5-dev \
            libglib2.0-dev libglibmm-2.4-dev libsigc++-2.0-dev \
            libusb-1.0-0-dev libzip-dev libserialport-dev \
            libboost-filesystem-dev libboost-serialization-dev

      - name: Build libsigrok + cxx bindings
        run: |
          cd libsigrok
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(nproc)"
          make install
          test -f "$GITHUB_WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }

      - name: Build PulseView
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/sr/lib/pkgconfig
        run: |
          cd pulseview
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sr" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          NAME=pulseview-linux-${{ matrix.arch }}
          mkdir -p "dist/$NAME"
          cp pulseview/build/pulseview "dist/$NAME/"
          cp -a sr/lib/libsigrok.so* sr/lib/libsigrokcxx.so* "dist/$NAME/"
          cp libsigrok/contrib/60-libsigrok.rules "dist/$NAME/" 2>/dev/null || true
          cat > "dist/$NAME/run-pulseview.sh" <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$0")
          export LD_LIBRARY_PATH="$HERE:$LD_LIBRARY_PATH"
          exec "$HERE/pulseview" "$@"
          EOF
          chmod +x "dist/$NAME/run-pulseview.sh"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "--- tarball contents ---"
          tar -tzf "$NAME.tar.gz"
          ls -l "$NAME.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: pulseview-linux-${{ matrix.arch }}
          path: pulseview-linux-${{ matrix.arch }}.tar.gz

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v7
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - name: Install dependencies
        run: |
          brew install qt@5 glibmm libsigc++ libusb libzip boost libserialport \
            autoconf automake libtool pkg-config cmake doxygen

      - name: Build libsigrok + cxx bindings
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          BP=$(brew --prefix)
          export PKG_CONFIG_PATH="$BP/opt/qt@5/lib/pkgconfig:$BP/opt/libusb/lib/pkgconfig:$BP/opt/libzip/lib/pkgconfig:$BP/opt/libserialport/lib/pkgconfig:$BP/lib/pkgconfig"
          cd libsigrok
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test -f "$GITHUB_WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }

      - name: Build PulseView
        run: |
          BP=$(brew --prefix)
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sr/lib/pkgconfig:$BP/opt/qt@5/lib/pkgconfig:$BP/opt/libusb/lib/pkgconfig:$BP/opt/libzip/lib/pkgconfig:$BP/opt/libserialport/lib/pkgconfig:$BP/lib/pkgconfig"
          cd pulseview
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$BP/opt/qt@5;$BP;$GITHUB_WORKSPACE/sr" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          NAME=pulseview-macos-arm64
          mkdir -p "dist/$NAME"
          cp pulseview/build/pulseview "dist/$NAME/"
          cp -a sr/lib/libsigrok.4.dylib sr/lib/libsigrokcxx.4.dylib "dist/$NAME/"
          cd "dist/$NAME"
          install_name_tool -id @rpath/libsigrok.4.dylib libsigrok.4.dylib
          install_name_tool -id @rpath/libsigrokcxx.4.dylib libsigrokcxx.4.dylib
          SRDEP=$(otool -L libsigrokcxx.4.dylib | awk '/libsigrok\.4\.dylib/{print $1;exit}')
          [ -n "$SRDEP" ] && install_name_tool -change "$SRDEP" @loader_path/libsigrok.4.dylib libsigrokcxx.4.dylib
          for L in libsigrokcxx.4.dylib libsigrok.4.dylib; do
            D=$(otool -L pulseview | awk -v l="$L" 'index($1,l){print $1;exit}')
            [ -n "$D" ] && install_name_tool -change "$D" "@loader_path/$L" pulseview
          done
          codesign --force --sign - pulseview libsigrok.4.dylib libsigrokcxx.4.dylib
          cat > run-pulseview.sh <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$0")
          export DYLD_LIBRARY_PATH="$HERE:$DYLD_LIBRARY_PATH"
          exec "$HERE/pulseview" "$@"
          EOF
          chmod +x run-pulseview.sh
          otool -L pulseview | grep -E "sigrok|loader" || true
          cd "$GITHUB_WORKSPACE"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "--- tarball contents ---"
          tar -tzf "$NAME.tar.gz"
          ls -l "$NAME.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: pulseview-macos-arm64
          path: pulseview-macos-arm64.tar.gz

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v7
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-libsigc++
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libserialport
            doxygen
            autoconf
            automake
            libtool
            make
            zip

      - name: Check doxygen
        shell: msys2 {0}
        run: |
          which doxygen
          doxygen --version

      - name: Build libsigrok + cxx bindings
        shell: msys2 {0}
        run: |
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          cd "$WORKSPACE/libsigrok"
          ./autogen.sh
          ./configure --prefix="$WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(nproc)"
          make install
          test -f "$WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }
          ls -l "$WORKSPACE/sr/bin" | head -20

      - name: Build PulseView
        shell: msys2 {0}
        run: |
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          export PKG_CONFIG_PATH="$WORKSPACE/sr/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd "$WORKSPACE/pulseview"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -w /ucrt64);$(cygpath -w "$WORKSPACE/sr")" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build

      - name: Package
        shell: msys2 {0}
        run: |
          WORKSPACE=$(cygpath -u "$GITHUB_WORKSPACE")
          PKG="$WORKSPACE/dist/pulseview-windows-x86_64"
          mkdir -p "$PKG"
          cp "$WORKSPACE/pulseview/build/pulseview.exe" "$PKG/"
          cp "$WORKSPACE"/sr/bin/libsigrok*.dll "$PKG/"
          cp "$WORKSPACE"/sr/bin/libsigrokcxx*.dll "$PKG/"
          cd "$PKG"
          WDEPLOY=$(ls /ucrt64/bin/windeployqt* 2>/dev/null | head -1)
          echo "windeployqt: $WDEPLOY"
          "$WDEPLOY" --release --no-translations --no-opengl-sw --no-angle pulseview.exe
          for i in 1 2 3 4 5 6; do
            ldd ./*.exe ./*.dll 2>/dev/null \
              | awk -F'=> ' '/=> \/ucrt64\//{print $2}' | awk '{print $1}' \
              | sort -u > /tmp/deps.txt
            added=0
            while read -r dll; do
              base=$(basename "$dll")
              if [ ! -f "$base" ]; then cp "$dll" .; added=1; fi
            done < /tmp/deps.txt
            [ "$added" -eq 0 ] && break
          done
          echo "--- package contents ---"
          ls -l "$PKG"
          cd "$WORKSPACE/dist"
          zip -r -q pulseview-windows-x86_64.zip pulseview-windows-x86_64
          unzip -l pulseview-windows-x86_64.zip | tail -5
          ls -l pulseview-windows-x86_64.zip

      - name: Smoke test (version + all DLLs load)
        shell: msys2 {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/dist/pulseview-windows-x86_64"
          ./pulseview.exe -V

      - uses: actions/upload-artifact@v7
        with:
          name: pulseview-windows-x86_64
          path: dist/pulseview-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos-arm64, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          generate_release_notes: true
