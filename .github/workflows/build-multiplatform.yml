name: Build multiplatform packages

on:
  push:
    branches: [master, vllogic-dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v4
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake autoconf-archive libtool pkg-config \
            cmake doxygen qtbase5-dev qttools5-dev qtbase5-dev-tools libqt5svg5-dev \
            libglib2.0-dev libglibmm-2.4-dev libsigc++-2.0-dev \
            libusb-1.0-0-dev libzip-dev libserialport-dev \
            libboost-filesystem-dev libboost-serialization-dev

      - name: Build libsigrok + cxx bindings
        run: |
          cd libsigrok
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(nproc)"
          make install
          test -f "$GITHUB_WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }

      - name: Build PulseView
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/sr/lib/pkgconfig
        run: |
          cd pulseview
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sr" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          NAME=pulseview-linux-${{ matrix.arch }}
          mkdir -p "dist/$NAME"
          cp pulseview/build/pulseview "dist/$NAME/"
          cp -a sr/lib/libsigrok.so* sr/lib/libsigrokcxx.so* "dist/$NAME/"
          cp libsigrok/contrib/60-libsigrok.rules "dist/$NAME/" 2>/dev/null || true
          cat > "dist/$NAME/run-pulseview.sh" <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$0")
          export LD_LIBRARY_PATH="$HERE:$LD_LIBRARY_PATH"
          exec "$HERE/pulseview" "$@"
          EOF
          chmod +x "dist/$NAME/run-pulseview.sh"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "--- tarball contents ---"
          tar -tzf "$NAME.tar.gz"
          ls -l "$NAME.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pulseview-linux-${{ matrix.arch }}
          path: pulseview-linux-${{ matrix.arch }}.tar.gz

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v4
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - name: Install dependencies
        run: |
          brew install qt@5 glibmm libsigc++ libusb libzip boost libserialport \
            autoconf automake libtool pkg-config cmake doxygen

      - name: Build libsigrok + cxx bindings
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          BP=$(brew --prefix)
          export PKG_CONFIG_PATH="$BP/opt/qt@5/lib/pkgconfig:$BP/opt/libusb/lib/pkgconfig:$BP/opt/libzip/lib/pkgconfig:$BP/opt/libserialport/lib/pkgconfig:$BP/lib/pkgconfig"
          cd libsigrok
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test -f "$GITHUB_WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }

      - name: Build PulseView
        run: |
          BP=$(brew --prefix)
          export PKG_CONFIG_PATH="$BP/opt/qt@5/lib/pkgconfig:$BP/opt/libusb/lib/pkgconfig:$BP/opt/libzip/lib/pkgconfig:$BP/opt/libserialport/lib/pkgconfig:$BP/lib/pkgconfig"
          cd pulseview
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$BP/opt/qt@5;$BP;$GITHUB_WORKSPACE/sr" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          NAME=pulseview-macos-arm64
          mkdir -p "dist/$NAME"
          cp pulseview/build/pulseview "dist/$NAME/"
          cp -a sr/lib/libsigrok.4.dylib sr/lib/libsigrokcxx.4.dylib "dist/$NAME/"
          cd "dist/$NAME"
          install_name_tool -id @rpath/libsigrok.4.dylib libsigrok.4.dylib
          install_name_tool -id @rpath/libsigrokcxx.4.dylib libsigrokcxx.4.dylib
          SRDEP=$(otool -L libsigrokcxx.4.dylib | awk '/libsigrok\.4\.dylib/{print $1;exit}')
          [ -n "$SRDEP" ] && install_name_tool -change "$SRDEP" @loader_path/libsigrok.4.dylib libsigrokcxx.4.dylib
          for L in libsigrokcxx.4.dylib libsigrok.4.dylib; do
            D=$(otool -L pulseview | awk -v l="$L" 'index($1,l){print $1;exit}')
            [ -n "$D" ] && install_name_tool -change "$D" "@loader_path/$L" pulseview
          done
          codesign --force --sign - pulseview libsigrok.4.dylib libsigrokcxx.4.dylib
          cat > run-pulseview.sh <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$0")
          export DYLD_LIBRARY_PATH="$HERE:$DYLD_LIBRARY_PATH"
          exec "$HERE/pulseview" "$@"
          EOF
          chmod +x run-pulseview.sh
          otool -L pulseview | grep -E "sigrok|loader" || true
          cd "$GITHUB_WORKSPACE"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "--- tarball contents ---"
          tar -tzf "$NAME.tar.gz"
          ls -l "$NAME.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pulseview-macos-arm64
          path: pulseview-macos-arm64.tar.gz

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v4
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: pv
          auto-activate: true

      - name: Install dependencies (conda-forge x86_64)
        shell: bash -el {0}
        run: |
          conda install -y qt-main glibmm libsigcpp libusb libzip boost libserialport \
            autoconf automake libtool pkg-config cmake doxygen

      - name: Build libsigrok + cxx bindings
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig"
          cd libsigrok
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test -f "$GITHUB_WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }

      - name: Build PulseView
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig"
          cd pulseview
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX;$GITHUB_WORKSPACE/sr" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          NAME=pulseview-macos-x86_64
          mkdir -p "dist/$NAME"
          cp pulseview/build/pulseview "dist/$NAME/"
          cp -a sr/lib/libsigrok.4.dylib sr/lib/libsigrokcxx.4.dylib "dist/$NAME/"
          cd "dist/$NAME"
          install_name_tool -id @rpath/libsigrok.4.dylib libsigrok.4.dylib
          install_name_tool -id @rpath/libsigrokcxx.4.dylib libsigrokcxx.4.dylib
          SRDEP=$(otool -L libsigrokcxx.4.dylib | awk '/libsigrok\.4\.dylib/{print $1;exit}')
          [ -n "$SRDEP" ] && install_name_tool -change "$SRDEP" @loader_path/libsigrok.4.dylib libsigrokcxx.4.dylib
          for L in libsigrokcxx.4.dylib libsigrok.4.dylib; do
            D=$(otool -L pulseview | awk -v l="$L" 'index($1,l){print $1;exit}')
            [ -n "$D" ] && install_name_tool -change "$D" "@loader_path/$L" pulseview
          done
          codesign --force --sign - pulseview libsigrok.4.dylib libsigrokcxx.4.dylib
          cat > run-pulseview.sh <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$0")
          export DYLD_LIBRARY_PATH="$HERE:$DYLD_LIBRARY_PATH"
          exec "$HERE/pulseview" "$@"
          EOF
          chmod +x run-pulseview.sh
          file pulseview
          cd "$GITHUB_WORKSPACE"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          echo "--- tarball contents ---"
          tar -tzf "$NAME.tar.gz"
          ls -l "$NAME.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pulseview-macos-x86_64
          path: pulseview-macos-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos-arm64, macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          generate_release_notes: true
