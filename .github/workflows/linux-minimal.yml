name: Linux x86_64 minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vllogic/libsigrok
          ref: vllogic-dev
          path: libsigrok

      - uses: actions/checkout@v7
        with:
          repository: vllogic/pulseview
          ref: ${{ github.ref_name }}
          path: pulseview

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake autoconf-archive libtool pkg-config \
            cmake doxygen qtbase5-dev qttools5-dev qtbase5-dev-tools libqt5svg5-dev \
            libglib2.0-dev libglibmm-2.4-dev libsigc++-2.0-dev \
            libusb-1.0-0-dev libzip-dev libserialport-dev \
            libboost-filesystem-dev libboost-serialization-dev

      - name: Build libsigrok + cxx bindings
        run: |
          cd libsigrok
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/sr" \
            --enable-cxx --disable-python --disable-ruby --disable-java \
            --disable-all-drivers --enable-vllogic-logic
          make -j"$(nproc)"
          make install
          test -f "$GITHUB_WORKSPACE/sr/lib/pkgconfig/libsigrokcxx.pc" \
            || { echo "ERROR: libsigrokcxx was not built (check configure summary)"; exit 1; }

      - name: Build PulseView
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/sr/lib/pkgconfig
        run: |
          cd pulseview
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sr" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_DECODE=OFF
          cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist/pulseview-linux-x86_64
          cp pulseview/build/pulseview dist/pulseview-linux-x86_64/
          cp -a sr/lib/libsigrok.so* sr/lib/libsigrokcxx.so* dist/pulseview-linux-x86_64/
          cp libsigrok/contrib/60-libsigrok.rules dist/ 2>/dev/null || true
          cat > dist/pulseview-linux-x86_64/run-pulseview.sh <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$0")
          export LD_LIBRARY_PATH="$HERE:$LD_LIBRARY_PATH"
          exec "$HERE/pulseview" "$@"
          EOF
          chmod +x dist/pulseview-linux-x86_64/run-pulseview.sh
          tar -C dist -czf pulseview-linux-x86_64.tar.gz pulseview-linux-x86_64
          echo "--- tarball contents ---"
          tar -tzf pulseview-linux-x86_64.tar.gz
          ls -l pulseview-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: pulseview-linux-x86_64
          path: pulseview-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true
